{% load static %}
{% if posts %}
<section class="blog-latest-section">
  <div class="container">
    <div class="blog-latest-head">
      <h2>From our blog</h2>
      <p>Practical reading on mental health and wellbeing, written by our counselors.</p>
    </div>
    <div class="row g-4">
      {% for post in posts %}
        <div class="col-md-6 col-lg-4">{% include "blog/includes/post_card.html" %}</div>
      {% endfor %}
    </div>
    <div class="text-center mt-4">
      <a href="{% url 'blog:list' %}" class="btn btn-lg">View all articles</a>
    </div>
  </div>
</section>
{% endif %}
